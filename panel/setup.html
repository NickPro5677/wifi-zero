<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0a0c10">
<title>wifi-zero · configuración inicial</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="stylesheet" href="/style.css">
</head>
<body class="login-body">
  <form class="login-card" id="form" autocomplete="on" aria-labelledby="setupTitle">
    <div class="brand">
      <span class="pulse-dot" aria-hidden="true"></span>
      <h1 id="setupTitle">WIFI-ZERO</h1>
    </div>
    <p class="sub" id="setupSub">Primera configuración · Pi/PC + PWA</p>
    <ul class="hint" id="hints" hidden></ul>
    <label for="user">Usuario
      <input id="user" name="username" autocomplete="username" value="admin" required>
    </label>
    <label for="pass">Contraseña (mín. 6)
      <input id="pass" name="password" type="password" autocomplete="new-password" required minlength="6">
    </label>
    <label for="pass2">Repetir contraseña
      <input id="pass2" name="password2" type="password" autocomplete="new-password" required minlength="6">
    </label>
    <fieldset class="setup-bind">
      <legend>Acceso al panel</legend>
      <label class="tog"><input type="radio" name="bind" id="bindLocal" value="127.0.0.1"> Solo este dispositivo (127.0.0.1)</label>
      <label class="tog"><input type="radio" name="bind" id="bindLan" value="0.0.0.0"> Toda la LAN (0.0.0.0) — teléfono PWA → Pi/PC</label>
      <p class="hint" id="bindHint">HTTP sin TLS: usa 0.0.0.0 solo en red de confianza. Ver docs/SECURITY.md.</p>
    </fieldset>
    <label class="tog"><input type="checkbox" id="startMon" checked> Arrancar monitor al terminar</label>
    <button class="btn primary" type="submit" id="go">Crear y entrar</button>
    <p class="hint" id="pwaHint">Tras el setup: en el teléfono abre http://&lt;IP-del-Pi&gt;:8788 e «Añadir a pantalla de inicio».</p>
    <p class="err" id="err" role="alert" aria-live="assertive"></p>
  </form>
<script>
(async () => {
  let recommended = "127.0.0.1";
  try {
    const r = await fetch("/api/setup/status");
    const d = await r.json();
    if (!d.setup_needed) location.href = "/login";
    if (d.recommended_bind) recommended = d.recommended_bind;
    if (d.runtime === "linux") {
      document.getElementById("setupSub").textContent =
        "Host Linux/Pi · el teléfono solo abre la PWA";
    } else if (d.runtime === "termux") {
      document.getElementById("setupSub").textContent =
        "Termux (legado) · preferible migrar el cerebro a un Pi/PC";
    }
    const box = document.getElementById("hints");
    if (d.hints && d.hints.length) {
      box.hidden = false;
      box.innerHTML = d.hints.slice(0, 4).map((h) => `<li>${h}</li>`).join("");
    }
  } catch (e) {}
  const lan = document.getElementById("bindLan");
  const local = document.getElementById("bindLocal");
  if (recommended === "0.0.0.0") lan.checked = true;
  else local.checked = true;
})();
const err = document.getElementById("err");
document.getElementById("form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const go = document.getElementById("go");
  const pw = document.getElementById("pass").value;
  if (pw !== document.getElementById("pass2").value) {
    err.textContent = "las contraseñas no coinciden";
    return;
  }
  go.disabled = true;
  const bind = (document.querySelector('input[name="bind"]:checked') || {}).value || "127.0.0.1";
  try {
    const r = await fetch("/api/setup", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({
        user: document.getElementById("user").value,
        password: pw,
        bind,
        start_monitor: document.getElementById("startMon").checked,
      }),
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || "fallo");
    localStorage.setItem("wz_token", d.token);
    location.href = "/";
  } catch (ex) {
    err.textContent = ex.message || "no se pudo completar el setup";
    go.disabled = false;
  }
});
</script>
</body>
</html>
