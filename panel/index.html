<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>wifi-zero · consola</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header>
  <h1>WIFI-ZERO</h1>
  <span class="sub">vigilancia de red · sin root</span>
  <span class="spacer"></span>
  <span class="sub" id="ver"></span>
  <button class="btn" id="btnScan">⚡ Escanear</button>
  <button class="btn" id="btnExport">⇩ CSV</button>
  <button class="btn" id="btnLogout">Salir</button>
</header>
<main>
  <div class="cards" id="cards"></div>

  <div class="filterbar">
    <input id="q" type="search" placeholder="buscar: ip · mac · vendor">
    <button class="btn" id="btnOnlyCrit">Solo críticos</button>
    <button class="btn" id="btnEvCrit">Eventos: solo alertas</button>
  </div>

  <h2>Red · hosts y riesgo</h2>
  <table id="tHosts"><thead><tr>
    <th>IP</th><th>MAC</th><th>Fabricante</th><th>Confianza</th><th>Riesgo</th><th>Estado</th><th>Última</th><th>Puertos</th>
  </tr></thead><tbody></tbody></table>

  <div class="grid2">
    <div>
      <h2>Wi‑Fi · APs visibles</h2>
      <table id="tAP"><thead><tr>
        <th>SSID</th><th>BSSID</th><th>CH</th><th>RSSI</th><th>Cifrado</th><th>Riesgo</th><th>Fabricante</th><th>Señal</th>
      </tr></thead><tbody></tbody></table>
      <h2>Redes memorizadas</h2>
      <table id="tNets"><thead><tr><th>SSID</th><th>BSSID</th><th>veces</th></tr></thead><tbody></tbody></table>
      <h2>Whitelist</h2>
      <table id="tWL"><thead><tr><th>MAC</th><th>Etiqueta</th><th>Confianza</th><th></th></tr></thead><tbody></tbody></table>
      <form id="wlForm" class="filterbar">
        <input id="wlMac" type="text" placeholder="aa:bb:cc:dd:ee:ff">
        <input id="wlLabel" type="text" placeholder="etiqueta (opcional)">
        <select id="wlTrust"><option value="1">confiable</option><option value="0">no confiable</option></select>
        <button class="btn" type="submit">Añadir</button>
      </form>
    </div>
    <div>
      <h2>Eventos en vivo <span id="liveState" class="sub"></span></h2>
      <ul class="ev-log" id="events"></ul>
    </div>
  </div>
</main>
<script src="/app.js"></script>
</body>
</html>
