<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>wifi-zero · acceso</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/style.css">
</head>
<body class="login-body">
  <div class="login-bg"></div>
  <form class="login-card glass" id="form" autocomplete="on">
    <div class="brand">
      <span class="pulse-dot"></span>
      <h1>WIFI-ZERO</h1>
    </div>
    <p class="sub">Consola de vigilancia de tu red · Termux</p>
    <label>Usuario
      <input id="user" name="username" autocomplete="username" placeholder="admin" value="admin">
    </label>
    <label>Contraseña
      <input id="pass" name="password" type="password" autocomplete="current-password" placeholder="••••••••">
    </label>
    <button class="btn primary" type="submit" id="go">Entrar</button>
    <p class="err" id="err" role="alert"></p>
  </form>
<script>
const err = document.getElementById("err");
document.getElementById("form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const go = document.getElementById("go");
  go.disabled = true;
  try {
    const r = await fetch("/api/login", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({
        user: document.getElementById("user").value,
        password: document.getElementById("pass").value,
      }),
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || "fallo");
    localStorage.setItem("wz_token", d.token);
    location.href = "/";
  } catch (ex) {
    err.textContent = ex.message || "credenciales inválidas";
    go.disabled = false;
  }
});
</script>
</body>
</html>
