<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0a0c10">
<title>wifi-zero · acceso</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="stylesheet" href="/style.css">
</head>
<body class="login-body">
  <form class="login-card" id="form" autocomplete="on" aria-labelledby="loginTitle">
    <div class="brand">
      <span class="pulse-dot" aria-hidden="true"></span>
      <h1 id="loginTitle">WIFI-ZERO</h1>
    </div>
    <p class="sub">Consola de vigilancia de tu red</p>
    <label for="user">Usuario
      <input id="user" name="username" autocomplete="username" placeholder="admin" value="admin">
    </label>
    <label for="pass">Contraseña
      <input id="pass" name="password" type="password" autocomplete="current-password" placeholder="••••••••">
    </label>
    <button class="btn primary" type="submit" id="go">Entrar</button>
    <p class="err" id="err" role="alert" aria-live="assertive"></p>
  </form>
<script>
(async () => {
  try {
    const r = await fetch("/api/setup/status");
    const d = await r.json();
    if (d.setup_needed) location.href = "/setup";
  } catch (e) {}
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(() => {});
})();
const err = document.getElementById("err");
document.getElementById("form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const go = document.getElementById("go");
  go.disabled = true;
  try {
    const r = await fetch("/api/login", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({
        user: document.getElementById("user").value,
        password: document.getElementById("pass").value,
      }),
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || "fallo");
    localStorage.setItem("wz_token", d.token);
    location.href = "/";
  } catch (ex) {
    err.textContent = ex.message || "credenciales inválidas";
    go.disabled = false;
  }
});
</script>
</body>
</html>
